<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Music Player</title>
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --cyan: #8be9fd;
      --gold: #f4d77a;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 20px;
      background:
        radial-gradient(circle at 20% 20%, rgba(139, 233, 253, 0.09), transparent 28%),
        radial-gradient(circle at 82% 74%, rgba(244, 215, 122, 0.07), transparent 24%),
        #05070a;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
      font-variant-ligatures: normal;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -30%;
      z-index: -1;
      background:
        linear-gradient(115deg, transparent 38%, rgba(139, 233, 253, 0.025) 49%, transparent 60%),
        linear-gradient(20deg, transparent 43%, rgba(244, 215, 122, 0.018) 50%, transparent 58%);
      animation: drift 18s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) rotate(-2deg); }
      to { transform: translate3d(3%, 2%, 0) rotate(2deg); }
    }

    .music-player {
      width: min(440px, 100%);
      padding: 18px;
      border: 1px solid rgba(139, 233, 253, 0.36);
      border-radius: 10px;
      background: linear-gradient(125deg, rgba(139, 233, 253, 0.09), transparent 56%), rgba(5, 12, 20, 0.94);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), inset 0 1px rgba(255, 255, 255, 0.06);
      animation: player-in 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes player-in {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    h1 {
      display: inline-block;
      margin: 0 0 14px;
      color: var(--cyan);
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .track {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) 92px;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.34);
    }

    .note {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid rgba(139, 233, 253, 0.32);
      border-radius: 5px;
      background: linear-gradient(145deg, rgba(139, 233, 253, 0.2), rgba(244, 215, 122, 0.08));
      color: var(--gold);
      font-family: inherit;
      font-size: 1.7rem;
    }

    .track-copy { min-width: 0; overflow-wrap: anywhere; }
    .track-copy strong {
      display: block;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .track-copy p { margin: 5px 0 0; color: rgba(255, 255, 255, 0.7); font-size: 0.75rem; }

    button, select, input { font: inherit; }

    button {
      min-height: 40px;
      border: 1px solid rgba(139, 233, 253, 0.7);
      border-radius: 5px;
      background: rgba(139, 233, 253, 0.12);
      color: #d5faff;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: rgba(139, 233, 253, 0.22); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    .progress { margin: 0 2px 16px; }
    .times { display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.68); font-size: 0.68rem; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .row {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .track-picker { position: relative; }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: center;
    }

    .loop-control { position: relative; }

    .loop-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 8;
      display: grid;
      width: 150px;
      gap: 4px;
      padding: 5px;
      border: 1px solid rgba(139, 233, 253, 0.36);
      border-radius: 4px;
      background: rgba(8, 13, 20, 0.98);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.48);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scaleY(0.96);
      transform-origin: top;
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
    }

    .loop-control.open .loop-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scaleY(1);
    }

    .loop-menu button {
      width: 100%;
      min-height: 36px;
      border: 0;
      background: transparent;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .loop-menu button:hover,
    .loop-menu button:focus-visible,
    .loop-menu button.active { background: rgba(139, 233, 253, 0.12); }

    #trackSearch {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid rgba(139, 233, 253, 0.36);
      border-radius: 4px;
      background: #080d14;
      color: #fff;
    }

    #trackSearch::placeholder { color: rgba(255, 255, 255, 0.48); }

    .track-menu {
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      right: 0;
      z-index: 5;
      max-height: min(280px, 45vh);
      overflow-y: auto;
      margin: 0;
      padding: 5px;
      border: 1px solid rgba(139, 233, 253, 0.36);
      border-radius: 4px;
      background: rgba(8, 13, 20, 0.98);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.48);
      list-style: none;
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scaleY(0.96);
      transform-origin: top;
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
    }

    .track-picker.open .track-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scaleY(1);
    }

    .track-menu button {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-menu button:hover,
    .track-menu button:focus-visible { background: rgba(139, 233, 253, 0.12); }

    .track-menu .empty-result {
      padding: 12px 10px;
      color: rgba(255, 255, 255, 0.58);
      font-size: 0.78rem;
    }

    .queue {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .queue-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .queue-heading strong {
      color: var(--gold);
      font-size: 0.68rem;
    }

    .queue-list {
      display: grid;
      gap: 4px;
      max-height: 150px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .queue-list li {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      min-height: 30px;
      padding: 4px 6px;
      border-radius: 3px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.72rem;
    }

    .queue-list li.current {
      background: rgba(139, 233, 253, 0.12);
      color: #d5faff;
    }

    .queue-index { color: rgba(244, 215, 122, 0.74); }

    input[type="file"] {
      width: 100%;
      min-height: 42px;
      padding: 5px;
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.7rem;
    }

    input[type="file"]::file-selector-button {
      margin-right: 10px;
      padding: 7px 9px;
      border: 1px solid rgba(139, 233, 253, 0.42);
      border-radius: 3px;
      background: rgba(139, 233, 253, 0.1);
      color: #d5faff;
      cursor: pointer;
      font: inherit;
    }

    .volume {
      display: grid;
      grid-template-columns: minmax(70px, 1fr) 42px;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.72rem;
    }

    .volume strong { color: var(--gold); text-align: right; }

    @media (max-width: 420px) {
      .track { grid-template-columns: 40px minmax(0, 1fr); }
      .track button { grid-column: 1 / -1; }
      .search-row { grid-template-columns: 1fr; }
      .search-row > .loop-control,
      .search-row > .loop-control > button { width: 100%; }
      .loop-menu { left: 0; right: 0; width: auto; }
    }
  </style>
</head>
<body>
  <main class="music-player">
    <h1>Music</h1>
    <div class="track">
      <span class="note" aria-hidden="true">♫</span>
      <div class="track-copy">
        <strong id="trackName">No track selected</strong>
        <p id="status" role="status" aria-live="polite">Paused</p>
      </div>
      <button id="toggle" type="button" aria-pressed="false">Play</button>
    </div>

    <div class="progress">
      <div class="times" aria-hidden="true">
        <span id="elapsed">0:00</span>
        <span id="duration">0:00</span>
      </div>
      <input id="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="Song position">
    </div>

    <div class="row">
      <span>Soundtrack</span>
      <div class="track-picker" id="trackPicker">
        <div class="search-row">
          <input id="trackSearch" type="search" placeholder="Search songs" autocomplete="off" aria-label="Search songs" aria-controls="trackMenu" aria-expanded="false">
          <div class="loop-control" id="loopControl">
            <button id="loop" type="button" aria-haspopup="menu" aria-expanded="false">Loop: Off</button>
            <div class="loop-menu" id="loopMenu" role="menu">
              <button type="button" role="menuitem" data-loop="off">Off</button>
              <button type="button" role="menuitem" data-loop="track">Loop track</button>
              <button type="button" role="menuitem" data-loop="playlist">Loop playlist</button>
            </div>
          </div>
        </div>
        <ul class="track-menu" id="trackMenu" role="listbox"></ul>
      </div>
      <div class="queue" aria-label="Song queue">
        <div class="queue-heading">
          <span>Up next</span>
          <strong id="queueCount">0 songs</strong>
        </div>
        <ol class="queue-list" id="queueList"></ol>
      </div>
    </div>

    <label class="row">
      <span>Import an MP3 or MP4 file</span>
      <input id="file" type="file" accept=".mp3,.mp4,audio/mpeg,audio/mp4,video/mp4">
    </label>

    <label class="volume">
      <span>Volume</span>
      <strong id="volumeValue">35%</strong>
      <input id="volume" type="range" min="0" max="100" step="1" value="35" aria-label="Volume">
    </label>

    <audio id="audio" preload="metadata" hidden></audio>
  </main>

  <script>
    const audio = document.getElementById("audio");
    const toggleButton = document.getElementById("toggle");
    const loopButton = document.getElementById("loop");
    const loopControl = document.getElementById("loopControl");
    const loopMenu = document.getElementById("loopMenu");
    const volumeControl = document.getElementById("volume");
    const volumeValue = document.getElementById("volumeValue");
    const status = document.getElementById("status");
    const trackName = document.getElementById("trackName");
    const progressControl = document.getElementById("progress");
    const elapsed = document.getElementById("elapsed");
    const duration = document.getElementById("duration");
    const fileControl = document.getElementById("file");
    const trackPicker = document.getElementById("trackPicker");
    const trackSearch = document.getElementById("trackSearch");
    const trackMenu = document.getElementById("trackMenu");
    const queueCount = document.getElementById("queueCount");
    const queueList = document.getElementById("queueList");

    const tracks = [
      "2008.mp3",
      "Meme.mp3",
      "Nope your too late i already died.mp3",
      "a-z niardica cover.mp3",
      "be ur man.mp3",
      "bipolar.mp3",
      "close my eyes.mp3",
      "comfort song 4 u.mp3",
      "drinking thinking of me.mp3",
      "elephant cage.mp3",
      "fake ur face.mp3",
      "give me hints.mp3",
      "glm.mp3",
      "im not alright.mp3",
      "im so blue for you.mp3",
      "isnt it obvious.mp3",
      "kiss her stpd face.mp3",
      "lost at the disco (feat. overtonight).mp3",
      "mirrors demo.mp3",
      "not enough (feat. she left me today) (sped up).mp3",
      "one big prison.mp3",
      "party.mp3",
      "r u kissin any1.mp3",
      "shotgun.mp3",
      "sorry i killed her.mp3",
      "stalk ur socials.mp3",
      "they'll post it online (slowed).mp3",
      "twenty four.mp3",
      "unhappy.mp3",
      "would u notice.mp3",
      "you are my friend.mp3",
      "youtube-audio (1).mp3",
      "youtube-audio (2).mp3",
      "youtube-audio (3).mp3",
      "youtube-audio.mp3"
    ];

    const trackTitles = {
      "youtube-audio.mp3": "Gozalo Slowed",
      "youtube-audio (1).mp3": "I’ll Kick Your Butt in Smash Bros",
      "youtube-audio (2).mp3": "Sanya Tekk",
      "youtube-audio (3).mp3": "Handmade"
    };

    const trackChoices = tracks.map((filename) => ({
      filename,
      title: trackTitles[filename] || filename.replace(/\.mp3$/i, "")
    }));

    function openTrackMenu() {
      trackPicker.classList.add("open");
      trackSearch.setAttribute("aria-expanded", "true");
    }

    function closeTrackMenu() {
      trackPicker.classList.remove("open");
      trackSearch.setAttribute("aria-expanded", "false");
    }

    function renderTrackMenu(query = "") {
      const matches = trackChoices.filter(({ title }) =>
        title.toLowerCase().includes(query.trim().toLowerCase())
      );
      trackMenu.replaceChildren();

      if (!matches.length) {
        const empty = document.createElement("li");
        empty.className = "empty-result";
        empty.textContent = "No matching songs";
        trackMenu.append(empty);
        return;
      }

      matches.forEach(({ filename, title }) => {
        const item = document.createElement("li");
        item.setAttribute("role", "option");
        const choice = document.createElement("button");
        choice.type = "button";
        choice.textContent = title;
        choice.addEventListener("click", () => selectTrack(filename, title));
        item.append(choice);
        trackMenu.append(item);
      });
    }

    let importedUrl = null;
    let loopMode = "off";
    let currentFilename = null;

    function renderQueue() {
      queueList.replaceChildren();
      const currentIndex = tracks.indexOf(currentFilename);
      const upcoming = currentIndex === -1
        ? trackChoices
        : trackChoices.slice(currentIndex);

      queueCount.textContent = `${upcoming.length} ${upcoming.length === 1 ? "song" : "songs"}`;
      upcoming.forEach(({ filename, title }, offset) => {
        const item = document.createElement("li");
        if (filename === currentFilename) item.classList.add("current");

        const index = document.createElement("span");
        index.className = "queue-index";
        index.textContent = String(currentIndex === -1 ? offset + 1 : currentIndex + offset + 1).padStart(2, "0");

        const name = document.createElement("span");
        name.textContent = title;
        item.append(index, name);
        queueList.append(item);
      });
    }

    function formatTime(time) {
      if (!Number.isFinite(time) || time < 0) return "0:00";
      const seconds = Math.floor(time);
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function updateProgress() {
      const canSeek = Number.isFinite(audio.duration) && audio.duration > 0;
      progressControl.disabled = !canSeek;
      progressControl.value = canSeek
        ? String(Math.round((audio.currentTime / audio.duration) * 1000))
        : "0";
      elapsed.textContent = formatTime(audio.currentTime);
      duration.textContent = formatTime(audio.duration);
      progressControl.setAttribute(
        "aria-valuetext",
        `${formatTime(audio.currentTime)} of ${formatTime(audio.duration)}`
      );
    }

    function setStoppedState() {
      toggleButton.textContent = "Play";
      toggleButton.setAttribute("aria-pressed", "false");
    }

    function clearImportedSource() {
      if (importedUrl) {
        URL.revokeObjectURL(importedUrl);
        importedUrl = null;
      }
    }

    async function togglePlayback() {
      if (!audio.hasAttribute("src")) {
        status.textContent = "Select or import a track first";
        return;
      }

      if (!audio.paused) {
        audio.pause();
        setStoppedState();
        status.textContent = "Paused";
        return;
      }

      try {
        await audio.play();
        toggleButton.textContent = "Pause";
        toggleButton.setAttribute("aria-pressed", "true");
        status.textContent = "Playing";
      } catch (error) {
        status.textContent = "Unable to play this file in your browser";
        setStoppedState();
        console.error(error);
      }
    }

    toggleButton.addEventListener("click", togglePlayback);

    function setLoopMode(mode) {
      loopMode = mode;
      audio.loop = mode === "track";
      loopButton.textContent = mode === "off"
        ? "Loop: Off"
        : mode === "track"
          ? "Loop: Track"
          : "Loop: Playlist";
      loopButton.setAttribute("aria-expanded", "false");
      loopControl.classList.remove("open");
      loopMenu.querySelectorAll("[data-loop]").forEach((option) => {
        option.classList.toggle("active", option.dataset.loop === mode);
      });
    }

    loopButton.addEventListener("click", () => {
      const isOpen = loopControl.classList.toggle("open");
      loopButton.setAttribute("aria-expanded", String(isOpen));
    });

    loopMenu.addEventListener("click", (event) => {
      const option = event.target.closest("[data-loop]");
      if (option) setLoopMode(option.dataset.loop);
    });

    document.addEventListener("pointerdown", (event) => {
      if (!loopControl.contains(event.target)) {
        loopControl.classList.remove("open");
        loopButton.setAttribute("aria-expanded", "false");
      }
    });

    function playTrack(filename, title, autoplay = false) {
      audio.pause();
      clearImportedSource();
      currentFilename = filename;
      audio.src = `assets/${filename}`;
      audio.loop = loopMode === "track";
      audio.volume = Number(volumeControl.value) / 100;
      trackName.textContent = title;
      trackSearch.value = title;
      status.textContent = "Paused";
      fileControl.value = "";
      setStoppedState();
      closeTrackMenu();
      renderQueue();
      audio.load();
      if (autoplay) audio.play().catch(() => {
        status.textContent = "Unable to play this file in your browser";
        setStoppedState();
      });
    }

    function selectTrack(filename, title) {
      playTrack(filename, title);
    }

    function playNextTrack() {
      const currentIndex = tracks.indexOf(currentFilename);
      const nextChoice = trackChoices[currentIndex + 1];
      if (nextChoice) playTrack(nextChoice.filename, nextChoice.title, true);
    }

    trackSearch.addEventListener("focus", openTrackMenu);
    trackSearch.addEventListener("input", () => {
      renderTrackMenu(trackSearch.value);
      openTrackMenu();
    });
    document.addEventListener("pointerdown", (event) => {
      if (!trackPicker.contains(event.target)) closeTrackMenu();
    });
    trackSearch.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeTrackMenu();
        trackSearch.blur();
      }
    });

    renderTrackMenu();
    renderQueue();
    setLoopMode("off");

    fileControl.addEventListener("change", () => {
      const file = fileControl.files[0];
      if (!file) return;
      if (!/\.(mp3|mp4)$/i.test(file.name)) {
        status.textContent = "Choose an MP3 or MP4 file";
        fileControl.value = "";
        return;
      }

      audio.pause();
      clearImportedSource();
      currentFilename = null;
      importedUrl = URL.createObjectURL(file);
      audio.src = importedUrl;
      audio.loop = loopMode === "track";
      audio.volume = Number(volumeControl.value) / 100;
      trackName.textContent = file.name;
      status.textContent = "Paused";
      trackSearch.value = "";
      renderTrackMenu();
      closeTrackMenu();
      setStoppedState();
      renderQueue();
      audio.load();
    });

    progressControl.addEventListener("input", () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = (Number(progressControl.value) / 1000) * audio.duration;
        updateProgress();
      }
    });

    volumeControl.addEventListener("input", () => {
      const volume = Number(volumeControl.value);
      volumeValue.textContent = `${volume}%`;
      audio.volume = volume / 100;
    });

    audio.addEventListener("loadedmetadata", updateProgress);
    audio.addEventListener("durationchange", updateProgress);
    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("play", () => {
      toggleButton.textContent = "Pause";
      toggleButton.setAttribute("aria-pressed", "true");
      status.textContent = "Playing";
    });
    audio.addEventListener("pause", () => {
      if (!audio.ended) status.textContent = "Paused";
      setStoppedState();
    });
    audio.addEventListener("ended", () => {
      if (loopMode !== "track" && currentFilename) {
        const currentIndex = tracks.indexOf(currentFilename);
        const nextChoice = trackChoices[currentIndex + 1];
        if (nextChoice) {
          playTrack(nextChoice.filename, nextChoice.title, true);
          return;
        }
        if (loopMode === "playlist" && trackChoices.length) {
          playTrack(trackChoices[0].filename, trackChoices[0].title, true);
          return;
        }
      }
      setStoppedState();
      status.textContent = "Finished";
    });
    audio.addEventListener("error", () => {
      if (audio.hasAttribute("src")) {
        setStoppedState();
        status.textContent = "Unable to load this file";
        updateProgress();
      }
    });

    audio.volume = Number(volumeControl.value) / 100;
    window.addEventListener("beforeunload", clearImportedSource);
  </script>
</body>
</html>
