<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alex's Music Hub</title>
  <link rel="icon" type="image/png" href="./assets/Neon Flame Diamond Emblem.png">
  <link rel="preconnect" href="https://classroom.teacher.homework.music.project.sandors.com">
  <style>
    * { box-sizing: border-box; }

    :root {
      color-scheme: dark;
      --cyan: #8be9fd;
      --gold: #f4d77a;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 20px 20px 78px;
      background:
        linear-gradient(rgba(5, 7, 10, 0.76), rgba(5, 7, 10, 0.76)),
        url("./assets/remove_object_01 (1).png") center / cover fixed,
        #05070a;
      color: #fff;
      font-family: "Segoe UI", Arial, sans-serif;
      font-variant-ligatures: normal;
      letter-spacing: 0;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -30%;
      z-index: -1;
      background:
        linear-gradient(115deg, transparent 38%, rgba(139, 233, 253, 0.025) 49%, transparent 60%),
        linear-gradient(20deg, transparent 43%, rgba(244, 215, 122, 0.018) 50%, transparent 58%);
      animation: drift 18s ease-in-out infinite alternate;
    }

    @keyframes drift {
      from { transform: translate3d(-2%, -1%, 0) rotate(-2deg); }
      to { transform: translate3d(3%, 2%, 0) rotate(2deg); }
    }

    .music-player {
      position: fixed;
      top: calc(50% - 29px);
      left: 50%;
      z-index: 10;
      translate: -50% -50%;
      width: min(440px, 100%);
      max-height: calc(100vh - 82px);
      overflow-y: auto;
      padding: 0 18px 18px;
      border: 1px solid rgba(139, 233, 253, 0.36);
      border-radius: 10px;
      background: linear-gradient(125deg, rgba(139, 233, 253, 0.09), transparent 56%), rgba(5, 12, 20, 0.94);
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.5), inset 0 1px rgba(255, 255, 255, 0.06);
      animation: player-in 560ms cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes player-in {
      from { opacity: 0; transform: translateY(14px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .player-window-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 46px;
      margin: 0 -18px 14px;
      border-bottom: 1px solid rgba(139, 233, 253, 0.18);
      cursor: grab;
      touch-action: none;
      user-select: none;
    }

    .player-window-bar:active { cursor: grabbing; }

    h1 {
      margin: 0;
      padding: 0 14px;
      color: var(--cyan);
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 0;
      line-height: 1.35;
      text-transform: uppercase;
    }

    .music-player.minimizing {
      pointer-events: none;
      animation: minimize-player 300ms cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes minimize-player {
      to {
        opacity: 0;
        transform: translate(var(--player-min-x), var(--player-min-y)) scale(0.08);
      }
    }

    .music-player.is-minimized {
      display: none;
    }

    .music-player.is-closed,
    .track-menu.is-closed { display: none; }

    .music-player.window-opening { animation: window-open 240ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .music-player.window-closing { pointer-events: none; animation: window-close 200ms ease-in forwards; }
    .track-menu.window-opening { animation: window-open 200ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .track-menu.window-closing { pointer-events: none; animation: window-close 180ms ease-in forwards; }

    @keyframes window-open {
      from { opacity: 0; transform: translateY(12px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes window-close {
      to { opacity: 0; transform: translateY(10px) scale(0.96); }
    }

    .player-window-controls { border-left: 0; }

    .desktop-shortcuts {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 2;
      display: grid;
      gap: 12px;
    }

    .desktop-shortcut {
      display: grid;
      justify-items: center;
      gap: 5px;
      width: 82px;
      min-height: 76px;
      padding: 6px 4px;
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 400;
      text-align: center;
      text-shadow: 0 1px 3px #000;
    }

    .desktop-shortcut:hover,
    .desktop-shortcut:focus-visible {
      border-color: rgba(139, 233, 253, 0.42);
      background: rgba(139, 233, 253, 0.14);
    }

    .shortcut-icon {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border: 1px solid rgba(139, 233, 253, 0.5);
      border-radius: 8px;
      background: linear-gradient(145deg, rgba(139, 233, 253, 0.24), rgba(8, 13, 20, 0.92));
      color: var(--gold);
      font-size: 1.5rem;
      text-shadow: none;
    }

    .taskbar {
      position: fixed;
      right: 0;
      bottom: 0;
      left: 0;
      z-index: 30;
      display: flex;
      min-height: 58px;
      align-items: center;
      gap: 6px;
      padding: 6px 12px max(6px, env(safe-area-inset-bottom));
      border-top: 1px solid rgba(139, 233, 253, 0.24);
      background: rgba(5, 9, 15, 0.88);
      box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.32);
      backdrop-filter: blur(14px);
    }

    .taskbar-app {
      position: relative;
      display: flex;
      min-width: 124px;
      min-height: 42px;
      align-items: center;
      justify-content: flex-start;
      gap: 9px;
      padding: 0 12px;
      border: 1px solid transparent;
      border-radius: 4px;
      background: transparent;
      color: rgba(255, 255, 255, 0.86);
      font-size: 0.78rem;
      font-weight: 500;
    }

    .taskbar-app:hover,
    .taskbar-app:focus-visible { background: rgba(139, 233, 253, 0.12); }

    .taskbar-app.running {
      border-color: rgba(139, 233, 253, 0.18);
      background: rgba(139, 233, 253, 0.08);
    }

    .taskbar-app.running::after {
      position: absolute;
      bottom: 3px;
      left: calc(50% - 9px);
      width: 18px;
      height: 2px;
      border-radius: 2px;
      background: var(--cyan);
      content: "";
    }

    .taskbar-icon {
      color: var(--gold);
      font-size: 1.1rem;
    }

    .external-window {
      position: fixed;
      top: calc(50% - 29px);
      left: 50%;
      z-index: 12;
      display: none;
      grid-template-rows: 40px minmax(0, 1fr);
      width: min(920px, calc(100vw - 32px));
      height: min(680px, calc(100vh - 82px));
      overflow: hidden;
      translate: -50% -50%;
      border: 1px solid rgba(139, 233, 253, 0.46);
      border-radius: 7px;
      background: rgba(8, 13, 20, 0.98);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.58);
    }

    .external-window.is-open { display: grid; }
    .external-window.is-minimized { display: none; }
    .external-window.minimizing { animation: minimize-all-songs 300ms cubic-bezier(0.4, 0, 1, 1) forwards; }
    .external-window.window-opening { animation: window-open 240ms cubic-bezier(0.16, 1, 0.3, 1) both; }
    .external-window.window-closing { pointer-events: none; animation: window-close 200ms ease-in forwards; }
    .external-window:fullscreen {
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      max-width: none;
      max-height: none;
      translate: none;
      border: 0;
      border-radius: 0;
    }

    @keyframes minimize-all-songs {
      to {
        opacity: 0;
        transform: translate(var(--all-songs-min-x), var(--all-songs-min-y)) scale(0.08);
      }
    }

    .all-songs-window-bar {
      cursor: move;
      touch-action: none;
    }

    .all-songs-window-bar .window-controls { align-items: center; }

    .external-window-link {
      padding: 0 10px;
      color: var(--cyan);
      font-size: 0.72rem;
      text-decoration: none;
    }

    .external-window-link:hover { text-decoration: underline; }

    .all-songs-frame {
      width: 100%;
      height: 100%;
      border: 0;
      background: #fff;
    }

    @media (max-width: 420px) {
      .taskbar { gap: 2px; padding-right: 6px; padding-left: 6px; }
      .taskbar-app { min-width: 0; flex: 1; justify-content: center; padding: 0 6px; }
      .desktop-shortcuts { top: 8px; left: 8px; }
      .external-window { width: calc(100vw - 16px); height: calc(100vh - 74px); }
    }

    .track {
      display: grid;
      grid-template-columns: 46px minmax(0, 1fr) minmax(92px, 106px);
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 6px;
      background: rgba(0, 0, 0, 0.34);
    }

    .note {
      display: grid;
      width: 46px;
      height: 46px;
      place-items: center;
      border: 1px solid rgba(139, 233, 253, 0.32);
      border-radius: 5px;
      background: linear-gradient(145deg, rgba(139, 233, 253, 0.2), rgba(244, 215, 122, 0.08));
      color: var(--gold);
      font-family: inherit;
      font-size: 1.7rem;
    }

    .track-copy { min-width: 0; max-width: 100%; overflow: hidden; overflow-wrap: anywhere; }
    .track-copy strong {
      display: block;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 400;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }
    .track-copy p { margin: 5px 0 0; color: rgba(255, 255, 255, 0.7); font-size: 0.75rem; }

    button, select, input { font: inherit; }

    button {
      min-height: 40px;
      border: 1px solid rgba(139, 233, 253, 0.7);
      border-radius: 5px;
      background: rgba(139, 233, 253, 0.12);
      color: #d5faff;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover { background: rgba(139, 233, 253, 0.22); }
    button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }

    #toggle { width: 100%; min-width: 92px; }

    .progress { margin: 0 2px 16px; }
    .times { display: flex; justify-content: space-between; color: rgba(255, 255, 255, 0.68); font-size: 0.68rem; }

    input[type="range"] {
      width: 100%;
      accent-color: var(--cyan);
      cursor: pointer;
    }

    .row {
      display: grid;
      gap: 8px;
      margin-top: 12px;
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.75rem;
      font-weight: 600;
    }

    .track-picker { position: relative; }

    .search-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) max-content;
      gap: 8px;
      align-items: stretch;
      width: 100%;
    }

    .loop-control { position: relative; min-width: 92px; }
    .loop-control > button { width: 100%; }

    .loop-menu {
      position: absolute;
      top: calc(100% + 6px);
      right: 0;
      z-index: 8;
      display: grid;
      width: 150px;
      gap: 4px;
      padding: 5px;
      border: 1px solid rgba(139, 233, 253, 0.36);
      border-radius: 4px;
      background: rgba(8, 13, 20, 0.98);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.48);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scaleY(0.96);
      transform-origin: top;
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
    }

    .loop-control.open .loop-menu {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scaleY(1);
    }

    .loop-menu button {
      width: 100%;
      min-height: 36px;
      border: 0;
      background: transparent;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 500;
    }

    .loop-menu button:hover,
    .loop-menu button:focus-visible,
    .loop-menu button.active { background: rgba(139, 233, 253, 0.12); }

    #trackSearch {
      min-width: 0;
      width: 100%;
      max-width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid rgba(139, 233, 253, 0.36);
      border-radius: 4px;
      background: #080d14;
      color: #fff;
    }

    #trackSearch::placeholder { color: rgba(255, 255, 255, 0.48); }

    .track-menu {
      position: fixed;
      z-index: 20;
      width: min(390px, calc(100vw - 24px));
      overflow: hidden;
      border: 1px solid rgba(139, 233, 253, 0.46);
      border-radius: 6px;
      background: rgba(8, 13, 20, 0.98);
      box-shadow: 0 22px 48px rgba(0, 0, 0, 0.58);
      opacity: 0;
      visibility: hidden;
      transform: translateY(-8px) scale(0.96);
      transform-origin: top left;
      transition: opacity 160ms ease, transform 160ms ease, visibility 160ms;
    }

    .track-picker.open .track-menu,
    .track-menu.open {
      opacity: 1;
      visibility: visible;
      transform: translateY(0) scale(1);
    }

    .window-bar {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      min-height: 38px;
      padding-left: 10px;
      border-bottom: 1px solid rgba(139, 233, 253, 0.22);
      background: linear-gradient(90deg, rgba(139, 233, 253, 0.13), rgba(244, 215, 122, 0.04));
      cursor: move;
      user-select: none;
      touch-action: none;
    }

    .window-title {
      overflow: hidden;
      color: #d5faff;
      font-size: 0.72rem;
      font-weight: 700;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .window-controls { display: flex; }

    .window-controls button {
      width: 38px;
      min-height: 38px;
      border: 0;
      border-left: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 0;
      background: transparent;
      color: rgba(255, 255, 255, 0.82);
      font-size: 1.05rem;
    }

    .window-controls button:hover { background: rgba(139, 233, 253, 0.16); }

    .track-menu-list {
      max-height: min(242px, 45vh);
      overflow-y: auto;
      margin: 0;
      padding: 5px;
      list-style: none;
    }

    .track-menu-list button {
      width: 100%;
      min-height: 38px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      text-align: left;
      font-size: 0.78rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .track-menu-list button:hover,
    .track-menu-list button:focus-visible { background: rgba(139, 233, 253, 0.12); }

    .track-menu-list .empty-result {
      padding: 12px 10px;
      color: rgba(255, 255, 255, 0.58);
      font-size: 0.78rem;
    }

    .track-menu.minimizing {
      animation: minimize-window 360ms cubic-bezier(0.4, 0, 1, 1) forwards;
    }

    @keyframes minimize-window {
      to {
        opacity: 0;
        transform: translate(var(--min-x), var(--min-y)) scale(0.08);
      }
    }

    .queue {
      display: grid;
      gap: 8px;
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .queue-heading {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.72rem;
      font-weight: 600;
    }

    .queue-heading strong {
      color: var(--gold);
      font-size: 0.68rem;
    }

    .queue-list {
      display: grid;
      gap: 4px;
      max-height: 150px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .queue-list li {
      min-width: 0;
      min-height: 30px;
      padding: 0;
      border-radius: 3px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 0.72rem;
    }

    .queue-list li.current {
      background: rgba(139, 233, 253, 0.12);
      color: #d5faff;
    }

    .queue-list button {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      width: 100%;
      min-height: 30px;
      padding: 4px 6px;
      border: 0;
      border-radius: 3px;
      background: transparent;
      color: inherit;
      text-align: left;
      cursor: pointer;
      font: inherit;
    }

    .queue-list button > span:last-child {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .queue-list button:hover,
    .queue-list button:focus-visible { background: rgba(139, 233, 253, 0.12); }

    .queue-index { color: rgba(244, 215, 122, 0.74); }

    input[type="file"] {
      min-width: 0;
      width: 100%;
      max-width: 100%;
      min-height: 42px;
      padding: 5px;
      border: 1px dashed rgba(255, 255, 255, 0.3);
      border-radius: 4px;
      color: rgba(255, 255, 255, 0.72);
      font-size: 0.7rem;
    }

    input[type="file"]::file-selector-button {
      margin-right: 10px;
      padding: 7px 9px;
      border: 1px solid rgba(139, 233, 253, 0.42);
      border-radius: 3px;
      background: rgba(139, 233, 253, 0.1);
      color: #d5faff;
      cursor: pointer;
      font: inherit;
    }

    .volume {
      display: grid;
      grid-template-columns: minmax(70px, 1fr) 42px;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.76);
      font-size: 0.72rem;
    }

    .volume strong { color: var(--gold); text-align: right; }

    @media (max-width: 420px) {
      .track { grid-template-columns: 40px minmax(0, 1fr); }
      .track button { grid-column: 1 / -1; }
      .search-row { grid-template-columns: 1fr; }
      .search-row > .loop-control,
      .search-row > .loop-control > button { width: 100%; }
      .loop-menu { left: 0; right: 0; width: auto; }
    }
  </style>
</head>
<body>
  <main class="music-player" id="musicPlayer">
    <div class="player-window-bar" id="playerWindowBar">
      <h1>Alex's Music Hub</h1>
      <div class="window-controls player-window-controls">
        <button id="minimizePlayer" type="button" aria-label="Minimize music player" title="Minimize">&#8213;</button>
        <button id="closePlayer" type="button" aria-label="Close music player" title="Close">&#215;</button>
      </div>
    </div>
    <div class="track">
      <span class="note" aria-hidden="true">♫</span>
      <div class="track-copy">
        <strong id="trackName">No track selected</strong>
        <p id="status" role="status" aria-live="polite">Paused</p>
      </div>
      <button id="toggle" type="button" aria-pressed="false">Play</button>
    </div>

    <div class="progress">
      <div class="times" aria-hidden="true">
        <span id="elapsed">0:00</span>
        <span id="duration">0:00</span>
      </div>
      <input id="progress" type="range" min="0" max="1000" step="1" value="0" aria-label="Song position">
    </div>

    <div class="row">
      <span>Soundtrack</span>
      <div class="track-picker" id="trackPicker">
        <div class="search-row">
          <input id="trackSearch" type="search" placeholder="Search songs" autocomplete="off" aria-label="Search songs" aria-controls="trackMenu" aria-expanded="false">
          <div class="loop-control" id="loopControl">
            <button id="loop" type="button" aria-haspopup="menu" aria-expanded="false">Loop: Off</button>
            <div class="loop-menu" id="loopMenu" role="menu">
              <button type="button" role="menuitem" data-loop="off">Off</button>
              <button type="button" role="menuitem" data-loop="track">Loop track</button>
              <button type="button" role="menuitem" data-loop="playlist">Loop playlist</button>
            </div>
          </div>
        </div>
        <div class="track-menu" id="trackMenu" role="dialog" aria-label="Song library">
          <div class="window-bar" id="trackWindowBar">
            <span class="window-title">Song Library</span>
            <div class="window-controls">
              <button id="minimizeLibrary" type="button" aria-label="Minimize song library" title="Minimize">&#8213;</button>
              <button id="closeLibrary" type="button" aria-label="Close song library" title="Close">&#215;</button>
            </div>
          </div>
          <ul class="track-menu-list" id="trackMenuList" role="listbox"></ul>
        </div>
      </div>
      <div class="queue" aria-label="Song queue">
        <div class="queue-heading">
          <span>Up next</span>
          <strong id="queueCount">0 songs</strong>
        </div>
        <ol class="queue-list" id="queueList"></ol>
      </div>
    </div>

    <label class="row">
      <span>Import an MP3 or MP4 file</span>
      <input id="file" type="file" accept=".mp3,.mp4,audio/mpeg,audio/mp4,video/mp4">
    </label>

    <label class="volume">
      <span>Volume</span>
      <strong id="volumeValue">35%</strong>
      <input id="volume" type="range" min="0" max="100" step="1" value="35" aria-label="Volume">
    </label>

    <audio id="audio" preload="metadata" hidden></audio>
  </main>

  <nav class="desktop-shortcuts" aria-label="Desktop shortcuts">
    <button class="desktop-shortcut" id="openPlayerShortcut" type="button" aria-label="Open Music Player">
      <span class="shortcut-icon" aria-hidden="true">♫</span>
      <span>Alex Music Preset</span>
    </button>
    <button class="desktop-shortcut" id="openLibraryShortcut" type="button" aria-label="Open Song Library">
      <span class="shortcut-icon" aria-hidden="true">▤</span>
      <span>Song Library</span>
    </button>
    <button class="desktop-shortcut" id="openAllSongsShortcut" type="button" aria-label="Open All Songs (in development)">
      <span class="shortcut-icon" aria-hidden="true">♪</span>
      <span>All Songs (in development)</span>
    </button>
    <button class="desktop-shortcut" id="openClassroomShortcut" type="button" aria-label="Open Classroom (g@m3s)">
      <span class="shortcut-icon" aria-hidden="true">▣</span>
      <span>Classroom (g@m3s)</span>

    const importedPlaylistKey = "music-player-imported-playlist-v1";
    let importedDatabase = null;

    function openImportedDatabase() {
      if (importedDatabase) return importedDatabase;
      importedDatabase = new Promise((resolve, reject) => {
        const request = indexedDB.open("music-player-library", 1);
        request.addEventListener("upgradeneeded", () => {
          request.result.createObjectStore("songs", { keyPath: "id" });
        });
        request.addEventListener("success", () => resolve(request.result));
        request.addEventListener("error", () => reject(request.error));
      });
      return importedDatabase;
    }

    async function readImportedSong(id) {
      const database = await openImportedDatabase();
      return new Promise((resolve, reject) => {
        const request = database.transaction("songs", "readonly").objectStore("songs").get(id);
        request.addEventListener("success", () => resolve(request.result?.blob || null));
        request.addEventListener("error", () => reject(request.error));
      });
    }

    async function storeImportedSong(id, blob) {
      const database = await openImportedDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction("songs", "readwrite");
        transaction.objectStore("songs").put({ id, blob });
        transaction.addEventListener("complete", resolve);
        transaction.addEventListener("error", () => reject(transaction.error));
      });
    }

    function readImportedPlaylist() {
      try {
        const saved = JSON.parse(localStorage.getItem(importedPlaylistKey) || "[]");
        return Array.isArray(saved)
          ? saved.filter((item) => item && typeof item.id === "string" && typeof item.title === "string")
          : [];
      } catch {
        return [];
      }
    }

    function saveImportedPlaylist() {
      const playlist = trackChoices.filter((track) => track.imported).map(({ id, title }) => ({ id, title }));
      localStorage.setItem(importedPlaylistKey, JSON.stringify(playlist));
    }

    async function loadImportedPlaylist() {
      const saved = readImportedPlaylist();
      let missingCount = 0;
      for (const item of saved) {
        const blob = await readImportedSong(item.id).catch(() => null);
        if (!blob) {
          missingCount += 1;
          continue;
        }
        trackChoices.push({ id: item.id, filename: item.id, title: item.title, imported: true, type: blob.type });
      }
      renderTrackMenu();
      renderQueue();
      if (missingCount) status.textContent = `Restored playlist; ${missingCount} missing file${missingCount === 1 ? "" : "s"}`;
    }

    function minimizePlayerWindow() {
      if (musicPlayer.classList.contains("is-minimized") || musicPlayer.classList.contains("is-closed") || musicPlayer.classList.contains("minimizing") || musicPlayer.classList.contains("window-closing")) return;
      const playerRect = musicPlayer.getBoundingClientRect();
      const dockRect = minimizedPlayer.getBoundingClientRect();
      musicPlayer.style.setProperty("--player-min-x", `${dockRect.left + dockRect.width / 2 - (playerRect.left + playerRect.width / 2)}px`);
      musicPlayer.style.setProperty("--player-min-y", `${dockRect.top + dockRect.height / 2 - (playerRect.top + playerRect.height / 2)}px`);
      musicPlayer.classList.add("minimizing");

      playerMinimizeTimer = window.setTimeout(() => {
        playerMinimizeTimer = null;
        if (!musicPlayer.classList.contains("minimizing")) return;
        musicPlayer.classList.remove("minimizing");
        musicPlayer.classList.add("is-minimized");
        minimizedPlayer.classList.add("running");
        minimizedPlayer.setAttribute("aria-pressed", "true");
      }, 300);
    }

    function restorePlayerWindow() {
      window.clearTimeout(playerCloseTimer);
      window.clearTimeout(playerMinimizeTimer);
      const needsOpening = musicPlayer.classList.contains("is-closed") ||
        musicPlayer.classList.contains("is-minimized") ||
        musicPlayer.classList.contains("window-closing");
      musicPlayer.classList.remove("is-closed", "is-minimized", "minimizing", "window-closing", "window-opening");
      if (needsOpening) {
        musicPlayer.classList.add("window-opening");
        window.setTimeout(() => musicPlayer.classList.remove("window-opening"), 240);
      }
      minimizedPlayer.classList.add("running");
      minimizedPlayer.setAttribute("aria-pressed", "true");
    }

    function closePlayerWindow() {
      if (musicPlayer.classList.contains("is-closed") || musicPlayer.classList.contains("window-closing")) return;
      window.clearTimeout(playerMinimizeTimer);

      clearImportedSource();
      currentFilename = null;

        playerCloseTimer = null;
      }, 200);

      minimizedPlayer.setAttribute("aria-pressed", "false");
    }

    async function toggleExternalFullscreen(container, frame, button, name) {
      try {
        if (document.fullscreenElement === container || document.fullscreenElement === frame) {
          await document.exitFullscreen();
        } else {
          await container.requestFullscreen();
        }
      } catch (error) {
        console.error(`Unable to fullscreen ${name}`, error);
        status.textContent = `Fullscreen is unavailable for ${name}`;
      }
      updateFullscreenButton(button, container, frame, name);

        trackMenu.classList.add("is-closed");
        closeTrackMenu();
        libraryCloseTimer = null;
      }, 180);
      minimizedLibrary.classList.remove("running");
      minimizedLibrary.setAttribute("aria-pressed", "false");
    }

    function minimizeTrackMenu() {
      if (!trackPicker.classList.contains("open") || trackMenu.classList.contains("minimizing")) return;
      const menuRect = trackMenu.getBoundingRect?.() || trackMenu.getBoundingClientRect();
      const dockRect = minimizedLibrary.getBoundingClientRect();
      const menuCenterX = menuRect.left + menuRect.width / 2;
      const menuCenterY = menuRect.top + menuRect.height / 2;
      const dockCenterX = dockRect.left + dockRect.width / 2;
      const dockCenterY = dockRect.top + dockRect.height / 2;
      trackMenu.style.setProperty("--min-x", `${dockCenterX - menuCenterX}px`);
      trackMenu.style.setProperty("--min-y", `${dockCenterY - menuCenterY}px`);
      trackMenu.classList.add("minimizing");

      window.setTimeout(() => {
        trackMenu.classList.add("is-minimized");
        closeTrackMenu();
        trackMenu.classList.remove("minimizing");
        minimizedLibrary.classList.add("running");
        minimizedLibrary.setAttribute("aria-pressed", "true");
      }, 360);
    }

    function renderTrackMenu(query = "") {
      const matches = trackChoices.filter(({ title }) =>
        title.toLowerCase().includes(query.trim().toLowerCase())
      );
      trackMenuList.replaceChildren();

      if (!matches.length) {
        const empty = document.createElement("li");
        empty.className = "empty-result";
        empty.textContent = "No matching songs";
        trackMenuList.append(empty);
        return;
      }

      matches.forEach(({ filename, title }) => {
        const item = document.createElement("li");
        item.setAttribute("role", "option");
        const choice = document.createElement("button");
        choice.type = "button";
        choice.textContent = title;
        choice.addEventListener("click", () => selectTrack(filename, title));
        item.append(choice);
        trackMenuList.append(item);
      });
    }

    let importedUrl = null;
    let loopMode = "off";
    let currentFilename = null;

    function renderQueue() {
      queueList.replaceChildren();

      queueCount.textContent = `${trackChoices.length} ${trackChoices.length === 1 ? "song" : "songs"}`;
      trackChoices.forEach(({ filename, title }, offset) => {
        const item = document.createElement("li");
        if (filename === currentFilename) item.classList.add("current");

        const choice = document.createElement("button");
        choice.type = "button";
        choice.setAttribute("aria-label", `Play ${title}`);

        const index = document.createElement("span");
        index.className = "queue-index";
        index.textContent = String(offset + 1).padStart(2, "0");

        const name = document.createElement("span");
        name.textContent = title;
        choice.append(index, name);
        choice.addEventListener("click", () => selectTrack(filename, title));
        item.append(choice);
        queueList.append(item);
      });
    }

    function formatTime(time) {
      if (!Number.isFinite(time) || time < 0) return "0:00";
      const seconds = Math.floor(time);
      return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, "0")}`;
    }

    function updateProgress() {
      const canSeek = Number.isFinite(audio.duration) && audio.duration > 0;
      progressControl.disabled = !canSeek;
      progressControl.value = canSeek
        ? String(Math.round((audio.currentTime / audio.duration) * 1000))
        : "0";
      elapsed.textContent = formatTime(audio.currentTime);
      duration.textContent = formatTime(audio.duration);
      progressControl.setAttribute(
        "aria-valuetext",
        `${formatTime(audio.currentTime)} of ${formatTime(audio.duration)}`
      );
    }

    function setStoppedState() {
      toggleButton.textContent = "Play";
      toggleButton.setAttribute("aria-pressed", "false");
    }

    function clearImportedSource() {
      if (importedUrl) {
        URL.revokeObjectURL(importedUrl);
        importedUrl = null;
      }
    }

    async function togglePlayback() {
      if (!audio.hasAttribute("src")) {
        status.textContent = "Select or import a track first";
        return;
      }

      if (!audio.paused) {
        audio.pause();
        setStoppedState();
        status.textContent = "Paused";
        return;
      }

      try {
        await audio.play();
        toggleButton.textContent = "Pause";
        toggleButton.setAttribute("aria-pressed", "true");
        status.textContent = "Playing";
      } catch (error) {
        status.textContent = "Unable to play this file in your browser";
        setStoppedState();
        console.error(error);
      }
    }

    toggleButton.addEventListener("click", togglePlayback);

    function setLoopMode(mode) {
      loopMode = mode;
      audio.loop = mode === "track";
      loopButton.textContent = mode === "off"
        ? "Loop: Off"
        : mode === "track"
          ? "Loop: Track"
          : "Loop: Playlist";
      loopButton.setAttribute("aria-expanded", "false");
      loopControl.classList.remove("open");
      loopMenu.querySelectorAll("[data-loop]").forEach((option) => {
        option.classList.toggle("active", option.dataset.loop === mode);
      });
    }

    loopButton.addEventListener("click", () => {
      const isOpen = loopControl.classList.toggle("open");
      loopButton.setAttribute("aria-expanded", String(isOpen));
    });

    loopMenu.addEventListener("click", (event) => {
      const option = event.target.closest("[data-loop]");
      if (option) setLoopMode(option.dataset.loop);
    });

    document.addEventListener("pointerdown", (event) => {
      if (!loopControl.contains(event.target)) {
        loopControl.classList.remove("open");
        loopButton.setAttribute("aria-expanded", "false");
      }
    });

    async function playTrack(filename, title, autoplay = false, imported = false) {
      audio.pause();
      clearImportedSource();
      currentFilename = filename;

      let source;
      if (imported) {
        const blob = await readImportedSong(filename);
        if (!blob) {
          status.textContent = "This saved song is no longer available";
          return;
        }
        importedUrl = URL.createObjectURL(blob);
        source = importedUrl;
      } else {
        source = `assets/${filename}`;
      }

      audio.src = source;
      audio.loop = loopMode === "track";
      audio.volume = Number(volumeControl.value) / 100;
      trackName.textContent = title;
      trackSearch.value = title;
      status.textContent = "Paused";
      fileControl.value = "";
      setStoppedState();
      closeTrackMenu();
      renderQueue();
      audio.load();
      if (autoplay) audio.play().catch(() => {
        status.textContent = "Unable to play this file in your browser";
        setStoppedState();
      });
    }

    function selectTrack(filename, title) {
      const choice = trackChoices.find((track) => track.filename === filename);
      playTrack(filename, title, false, Boolean(choice?.imported));
    }

    function playNextTrack() {
      const currentIndex = trackChoices.findIndex((track) => track.filename === currentFilename);
      const nextChoice = trackChoices[currentIndex + 1];
      if (nextChoice) playTrack(nextChoice.filename, nextChoice.title, true, Boolean(nextChoice.imported));
    }

    trackSearch.addEventListener("focus", openTrackMenu);
    trackSearch.addEventListener("click", openTrackMenu);
    trackSearch.addEventListener("input", () => {
      renderTrackMenu(trackSearch.value);
      openTrackMenu();
    });
    document.addEventListener("pointerdown", (event) => {
      if (!trackPicker.contains(event.target) && !trackMenu.contains(event.target)) closeTrackMenu();
    });
    minimizeLibrary.addEventListener("click", minimizeTrackMenu);
    closeLibrary.addEventListener("click", closeLibraryWindow);
    minimizedLibrary.addEventListener("click", () => {
      if (trackMenu.classList.contains("open")) {
        minimizeTrackMenu();
      } else {
        openTrackMenu();
      }
    });
    openLibraryShortcut.addEventListener("click", openTrackMenu);

    trackWindowBar.addEventListener("pointerdown", (event) => {
      if (event.target.closest("button")) return;
      const rect = trackMenu.getBoundingClientRect();
      dragOffset = { x: event.clientX - rect.left, y: event.clientY - rect.top };
      trackWindowBar.setPointerCapture(event.pointerId);
    });

    trackWindowBar.addEventListener("pointermove", (event) => {
      if (!dragOffset) return;
      const left = Math.max(0, Math.min(innerWidth - trackMenu.offsetWidth, event.clientX - dragOffset.x));
      const top = Math.max(0, Math.min(innerHeight - trackMenu.offsetHeight, event.clientY - dragOffset.y));
      trackMenu.style.left = `${left}px`;
      trackMenu.style.top = `${top}px`;
    });

    trackWindowBar.addEventListener("pointerup", () => { dragOffset = null; });
    trackWindowBar.addEventListener("pointercancel", () => { dragOffset = null; });

    trackSearch.addEventListener("keydown", (event) => {
      if (event.key === "Escape") {
        closeTrackMenu();
        trackSearch.blur();
      }
    });

    renderTrackMenu();
    renderQueue();
    setLoopMode("off");
    loadImportedPlaylist().catch(() => {
      status.textContent = "Imported songs could not be restored";
    });

    fileControl.addEventListener("change", async () => {
      const file = fileControl.files[0];
      if (!file) return;
      if (!/\.(mp3|mp4)$/i.test(file.name)) {
        status.textContent = "Choose an MP3 or MP4 file";
        fileControl.value = "";
        return;
      }

      const id = `imported-${crypto.randomUUID?.() || `${Date.now()}-${Math.random().toString(16).slice(2)}`}`;
      const title = file.name.replace(/\.(mp3|mp4)$/i, "") || file.name;

      try {
        await storeImportedSong(id, file);
        trackChoices.push({ id, filename: id, title, imported: true, type: file.type });
        saveImportedPlaylist();
        await playTrack(id, title, false, true);
        renderTrackMenu();
        renderQueue();
        status.textContent = "Saved to local playlist";
        trackSearch.value = title;
      } catch (error) {
        console.error(error);
        status.textContent = "Unable to save this song locally";
      } finally {
        fileControl.value = "";
      }
    });

    progressControl.addEventListener("input", () => {
      if (Number.isFinite(audio.duration)) {
        audio.currentTime = (Number(progressControl.value) / 1000) * audio.duration;
        updateProgress();
      }
    });

    volumeControl.addEventListener("input", () => {
      const volume = Number(volumeControl.value);
      volumeValue.textContent = `${volume}%`;
      audio.volume = volume / 100;
    });

    audio.addEventListener("loadedmetadata", updateProgress);
    audio.addEventListener("durationchange", updateProgress);
    audio.addEventListener("timeupdate", updateProgress);
    audio.addEventListener("play", () => {
      toggleButton.textContent = "Pause";
      toggleButton.setAttribute("aria-pressed", "true");
      status.textContent = "Playing";
    });
    audio.addEventListener("pause", () => {
      if (!audio.ended) status.textContent = "Paused";
      setStoppedState();
    });
    audio.addEventListener("ended", () => {
      if (loopMode !== "track" && currentFilename) {
        const currentIndex = trackChoices.findIndex((track) => track.filename === currentFilename);
        const nextChoice = trackChoices[currentIndex + 1];
        if (nextChoice) {
          playTrack(nextChoice.filename, nextChoice.title, true, Boolean(nextChoice.imported));
          return;
        }
        if (loopMode === "playlist" && trackChoices.length) {
          playTrack(trackChoices[0].filename, trackChoices[0].title, true);
          return;
        }
      }
      setStoppedState();
      status.textContent = "Finished";
    });
    audio.addEventListener("error", () => {
      if (audio.hasAttribute("src")) {
        setStoppedState();
        status.textContent = "Unable to load this file";
        updateProgress();
      }
    });

    audio.volume = Number(volumeControl.value) / 100;
    window.addEventListener("beforeunload", clearImportedSource);
  </script>
</body>
</html>
